name: Swift CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - uses: swift-actions/setup-swift@v2
      with:
        swift-version: '6.0.2'

    - name: Build
      run: swift build

    - name: Lint
      run: swift format lint --configuration swift-format.json -s -r .

    - name: Run tests
      run: swift test

    - name: Run E2E tests
      run: ./E2ETests/e2eTest.sh
